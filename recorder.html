<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WeScreen</title>
    <link rel="stylesheet" href="recorder.css">
  </head>
  <body>
    <main class="app">
      <header><div><span class="eyebrow">LOCAL · PRIVATE · EDGE</span><h1>WeScreen</h1></div><button id="language" class="quiet">中文 / EN</button></header>
      <section id="setup" class="panel"><p>录制整个屏幕、窗口或标签页。所有媒体只在你的设备上处理。</p><div class="grid"><label><span>文件名</span><input id="filename" value="wescreen-recording" maxlength="80"></label><label><span>画质</span><select id="quality"><option value="standard">1080p · 标准</option><option value="high">1080p · 高画质</option><option value="compact">720p · 节省空间</option></select></label><label><span>倒计时</span><select id="countdown"><option value="0">不等待</option><option value="3" selected>3 秒</option><option value="5">5 秒</option></select></label><label><span>自动停止</span><select id="autostop"><option value="0">不设置</option><option value="300">5 分钟</option><option value="900">15 分钟</option><option value="1800">30 分钟</option></select></label></div><fieldset><legend>音视频源</legend><label class="toggle"><input id="screen-audio" type="checkbox" checked><span>系统 / 标签页音频</span></label><label class="toggle"><input id="microphone" type="checkbox"><span>麦克风旁白</span></label></fieldset><button id="start" class="primary">开始录制</button><p class="hint">录制中可按 Ctrl/⌘ + Shift + S 停止；Ctrl/⌘ + Shift + U 暂停或继续。</p></section>
      <section id="recording" class="panel hidden"><div class="record-head"><div><span class="live">REC</span><strong id="timer">00:00</strong></div><span id="memory">本地分段保护已开启</span></div><div class="controls"><button id="pause" class="quiet">暂停</button><button id="stop" class="danger">停止录制</button></div><p class="hint">录制片段会暂存到本机，以便意外关闭后恢复。</p></section>
      <section id="result" class="panel hidden"><h2>录制完成</h2><video id="preview" controls></video><div class="controls"><button id="download" class="primary">下载 WebM</button><button id="new-recording" class="quiet">新建录制</button></div></section>
      <section id="recovery" class="recovery hidden"><span>检测到未完成的本地录制。</span><button id="recover" class="quiet">恢复并下载</button><button id="discard" class="text">丢弃</button></section>
    </main>
    <script src="recorder.js"></script>
  </body>
</html>
