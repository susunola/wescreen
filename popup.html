<!doctype html>
<html lang="zh-CN">
  <head><meta charset="utf-8"><link rel="stylesheet" href="popup.css"></head>
  <body>
    <main>
      <div class="brand-title"><strong>WeScreen</strong><span class="version-badge" data-app-version hidden></span></div>
      <p id="lead">选择录制范围并保存视频。</p>
      <p class="privacy" id="privacy"></p>
      <label for="record-url" id="url-label">Open a link to record</label>
      <div class="link-row"><input id="record-url" type="url" inputmode="url" placeholder="https://example.com"><button id="open-link" type="button">Open</button></div>
      <p class="link-hint" id="link-hint">After it opens, click WeScreen in that tab and start recording.</p>
      <button id="open">打开录制器</button>
    </main>
    <script src="version.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
